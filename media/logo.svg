<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Deep cosmic background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" /> <!-- slate dark -->
      <stop offset="50%" stop-color="#1e1b4b" /> <!-- deep violet -->
      <stop offset="100%" stop-color="#312e81" /> <!-- indigo -->
    </linearGradient>
    
    <!-- Vivid knowledge glow (cyan to purple to pink) -->
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" /> <!-- cyan -->
      <stop offset="50%" stop-color="#8b5cf6" /> <!-- purple -->
      <stop offset="100%" stop-color="#ec4899" /> <!-- pink -->
    </linearGradient>

    <!-- Star gradient -->
    <linearGradient id="star-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" /> 
      <stop offset="100%" stop-color="#c084fc" /> 
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />

  <g transform="translate(176, 186)" filter="url(#shadow)">
    
    <!-- THE BOOK OF KNOWLEDGE (Base) -->
    <!-- Bottom pages layer -->
    <path fill="url(#glow-grad)" opacity="0.6"
          d="M 80 140 L 20 110 L 20 130 L 80 160 Z
             M 80 140 L 140 110 L 140 130 L 80 160 Z" 
          filter="url(#neon-glow)" />
          
    <!-- Top pages layer -->
    <path fill="url(#glow-grad)" 
          d="M 80 125 L 30 100 L 30 110 L 80 135 Z
             M 80 125 L 130 100 L 130 110 L 80 135 Z" 
          filter="url(#neon-glow)" />

    <!-- THE LETTER "H" (Monolith of Learning) -->
    <!-- Left Pillar -->
    <path fill="#ffffff" opacity="0.95"
          d="M 40 20 L 60 20 L 60 115 L 40 105 Z" />
    <!-- Right Pillar -->
    <path fill="#ffffff" opacity="0.95"
          d="M 100 20 L 120 20 L 120 105 L 100 115 Z" />
    <!-- Crossbar -->
    <path fill="#ffffff" opacity="0.95"
          d="M 60 55 L 100 55 L 100 75 L 60 75 Z" />

    <!-- THE SPARK OF INSIGHT (Top Star) -->
    <path fill="url(#star-grad)" 
          d="M 80 -30 L 85 -10 L 105 -5 L 85 0 L 80 20 L 75 0 L 55 -5 L 75 -10 Z" 
          filter="url(#neon-glow)" />
          
    <!-- Core white spark -->
    <path fill="#ffffff"
          d="M 80 -25 L 83 -12 L 96 -5 L 83 2 L 80 15 L 77 2 L 64 -5 L 77 -12 Z" />
  </g>
</svg>
